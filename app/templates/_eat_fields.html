<fieldset class="person-picker">
  <legend>Meal <em>(optional)</em></legend>
  <div class="person-row">
    {% for item in meal_slots %}
    <label class="person-chip">
      <input type="radio" name="slot" value="{{ item }}"
             {% if (meal is defined and meal.slot == item) or (meal is not defined and item == 'lunch') %}checked{% endif %}>
      <span class="person-name">{{ item }}</span>
    </label>
    {% endfor %}
  </div>
</fieldset>

<fieldset class="interval">
  <legend>How much <em>(optional)</em></legend>
  <div class="toggles">
    <label class="toggle">
      <input type="radio" name="size" value="" {% if meal is not defined or not meal.size %}checked{% endif %}>
      <span>Not tracking</span>
    </label>
    {% for item in meal_sizes %}
    <label class="toggle">
      <input type="radio" name="size" value="{{ item }}" {% if meal is defined and meal.size == item %}checked{% endif %}>
      <span>{{ item }}</span>
    </label>
    {% endfor %}
  </div>
</fieldset>

<details class="extras" {% if extras_open %}open{% endif %}>
  <summary>When or a note</summary>
  <label>
    <span>When</span>
    <input type="datetime-local" name="recorded_at" value="{{ recorded_at_value }}">
  </label>
  <label class="notes-field">
    <span>Note</span>
    <input type="text" name="notes" maxlength="200" placeholder="Leftovers, out to eat…"
           value="{{ meal.notes if meal is defined and meal.notes else '' }}">
  </label>
</details>
