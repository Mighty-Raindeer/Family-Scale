<fieldset class="interval">
  <legend>{{ label }} <em>(optional)</em></legend>
  <div class="toggles">
    {% for n in range(1, 6) %}
    <label class="toggle">
      <input type="radio" name="{{ field }}" value="{{ n }}" {% if value == n %}checked{% endif %}>
      <span>{{ n }}</span>
    </label>
    {% endfor %}
  </div>
</fieldset>
