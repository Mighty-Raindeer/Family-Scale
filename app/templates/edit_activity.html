{% extends "base.html" %}
{% block title %}Edit movement · Family Scale{% endblock %}
{% block content %}
<section class="page">
  <header class="page-head">
    <p class="eyebrow">{{ person.name }}</p>
    <h1>Edit movement</h1>
    <p class="lede">Leave anything blank that you do not want to keep.</p>
  </header>
  <form method="post" class="log-form">
    {% with extras_open=true %}
    {% include "_move_fields.html" %}
    {% endwith %}
    <div class="row-actions">
      <button type="submit" class="primary">Save changes</button>
      <a class="ghost" href="{{ url_for('main.progress', person=person.id) }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
